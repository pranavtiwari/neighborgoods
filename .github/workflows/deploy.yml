# Deploy to Firebase: automatically on push to main (after full test suite passes),
# or manually dispatched via GitHub Actions UI.
# Required repository secrets:
#   - SHAREINSTEAD_SERVICE_ACCOUNT_KEY: JSON key for Firebase deploy service account
#   - FIREBASE_CONFIG_JS: contents of site/public/config.js
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'firebase use alias (e.g. staging, production) or "default"'
        required: false
        default: 'default'

concurrency:
  group: deploy-firebase-${{ inputs.target || 'default' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run the full test suite before deploying
        run: npm test

      - name: Write Firebase service account key and client config
        env:
          SA_KEY: ${{ secrets.SHAREINSTEAD_SERVICE_ACCOUNT_KEY }}
          CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "Error: SHAREINSTEAD_SERVICE_ACCOUNT_KEY secret is not set." >&2
            exit 1
          fi
          if [ -z "$CONFIG_JS" ]; then
            echo "Error: FIREBASE_CONFIG_JS secret is not set." >&2
            exit 1
          fi
          printf '%s' "$SA_KEY" > shareinstead-service-account-key.json
          printf '%s' "$CONFIG_JS" > site/public/config.js

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Select Firebase project
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/shareinstead-service-account-key.json
          DEPLOY_TARGET: ${{ inputs.target || 'default' }}
        run: firebase use "$DEPLOY_TARGET"

      - name: Deploy Firestore rules, indexes, and Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/shareinstead-service-account-key.json
        run: firebase deploy --only firestore:rules,firestore:indexes,storage --non-interactive

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/shareinstead-service-account-key.json
        run: firebase deploy --only functions --non-interactive

      - name: Build and deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/shareinstead-service-account-key.json
        run: |
          npm run build
          firebase deploy --only hosting --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f shareinstead-service-account-key.json

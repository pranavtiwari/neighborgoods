<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share, Instead. - Chat</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
    <script>requireAuth();</script>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        if (window.tailwind) {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#0d631b",
                            "primary-container": "#2e7d32",
                            surface: "#fbf9f6",
                            "on-surface": "#1b1c1a",
                            "on-surface-variant": "#40493d",
                            "surface-container": "#efeeeb",
                            "surface-container-low": "#f5f3f0",
                            "surface-container-lowest": "#ffffff",
                        },
                        fontFamily: {
                            body: ["Lexend"],
                        }
                    }
                }
            };
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="bg-surface font-body text-on-surface antialiased flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-[#fbf9f6]/80 dark:bg-stone-900/80 backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-[0_12px_40px_rgba(51,51,51,0.06)]">
        <div class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-stone-200 transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full overflow-hidden">
                        <img id="target-avatar" src="https://placehold.co/100x100?text=..." class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 id="target-name" class="font-bold text-lg leading-tight">...</h1>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-xs text-primary font-medium flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span> Online
                            </span>
                            <span class="text-stone-300 dark:text-stone-700 text-xs">•</span>
                            <span id="target-rating-badge" class="text-xs font-semibold text-amber-600 dark:text-amber-400 flex items-center gap-0.5">
                                <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
                                <span id="target-rating-text">...</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="p-2 rounded-full hover:bg-stone-200 transition-colors">
                <span class="material-symbols-outlined">info</span>
            </button>
        </div>
    </header>

    <!-- Context Card -->
    <div id="context-card" class="px-6 py-3 sticky top-[72px] z-40 bg-surface/80 backdrop-blur-sm hidden">
        <div class="bg-surface-container-lowest rounded-xl p-3 shadow-[0_4px_20px_rgba(51,51,51,0.04)] flex items-center gap-4 max-w-xl mx-auto">
            <div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0">
                <img id="context-item-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                    <h2 id="context-item-name" class="text-sm font-bold truncate">...</h2>
                    <span id="context-item-rating" class="text-xs font-semibold text-amber-600 dark:text-amber-400 flex items-center gap-0.5 shrink-0 hidden">
                        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
                        <span id="context-item-rating-text">0.0</span>
                    </span>
                </div>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[10px] uppercase font-black text-primary tracking-widest" id="context-item-category">...</span>
                </div>
            </div>
            <button class="bg-primary/5 text-primary px-3 py-1.5 rounded-lg text-xs font-bold shrink-0">View Item</button>
        </div>
    </div>

    <!-- Transaction State Bar / Stepper -->
    <div id="transaction-bar" class="px-6 pb-3 sticky top-[148px] z-35 bg-surface/80 backdrop-blur-sm hidden">
        <div class="bg-surface-container-low border border-outline-variant/10 rounded-xl p-4 shadow-sm max-w-xl mx-auto flex flex-col gap-4">
            <!-- Dynamic Visual Stepper Container -->
            <div id="transaction-stepper-visual" class="flex items-center justify-between w-full px-2">
                <!-- Stepper circles and lines will be injected here -->
            </div>
            
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-2 border-t border-outline-variant/10">
                <div class="min-w-0 flex-1">
                    <p id="transaction-status-text" class="text-xs font-bold text-on-surface truncate">Transaction Status: Loading...</p>
                    <p id="transaction-helper-text" class="text-[10px] text-on-surface-variant font-medium mt-0.5 leading-tight">...</p>
                </div>
                <div id="transaction-actions" class="flex flex-wrap gap-2 w-full sm:w-auto justify-end shrink-0">
                    <!-- Action buttons injected dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Message List -->
    <main id="chat-messages" class="flex-1 overflow-y-auto px-6 py-8 space-y-6 flex flex-col hide-scrollbar">
        <div id="chat-loading" class="text-center text-sm font-medium text-stone-400 mt-10 animate-pulse">Starting secure chat...</div>
    </main>

    <!-- Sticky Input -->
    <footer class="p-6 bg-surface border-t border-outline-variant/10 shrink-0">
        <form id="chat-form" class="max-w-xl mx-auto flex items-center gap-3">
            <button type="button" class="w-12 h-12 flex items-center justify-center rounded-full bg-stone-200/50 text-on-surface">
                <span class="material-symbols-outlined">add</span>
            </button>
            <div class="flex-1 relative">
                <input type="text" id="message-input" required autocomplete="off" placeholder="Type a message..." class="w-full bg-stone-200/50 border-none rounded-2xl px-5 py-3 focus:ring-0 focus:bg-stone-200/80 transition-colors">
            </div>
            <button type="submit" id="send-btn" class="w-12 h-12 flex items-center justify-center rounded-full bg-primary text-white shadow-lg active:scale-95 transition-transform">
                <span class="material-symbols-outlined">send</span>
            </button>
        </form>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('userId');
        let contextItemId = urlParams.get('itemId');
        const escapeHtml = window.db.escapeHtml;

        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const chatForm = document.getElementById('chat-form');
        
        let currentUser = null;
        let targetUser = null;

        async function initChat() {
            const session = await requireAuth();
            if (!session) return;
            currentUser = session.user;

            if (!targetUserId) {
                chatMessages.innerHTML = `<div class="text-center text-error mt-10 font-bold">Error: No target user specified.</div>`;
                return;
            }

            // Fetch ratings summary
            const ratingsSummary = await window.db.getRatingsSummary();

            // Fetch Target User Info
            const profileData = await window.db.getProfile(targetUserId);
            
            if (profileData) {
                targetUser = profileData;
                document.getElementById('target-name').textContent = profileData.full_name || 'Anonymous User';
                if (profileData.avatar_url) document.getElementById('target-avatar').src = profileData.avatar_url;
                
                // Get reputation from ratingsSummary or fallback to profileData.reputation_score
                const userRating = ratingsSummary.userRatings[targetUserId];
                const ratingVal = userRating ? userRating.average : (profileData.reputation_score || 5.0);
                document.getElementById('target-rating-text').textContent = `${Number(ratingVal).toFixed(1)} reputation`;
            } else {
                document.getElementById('target-name').textContent = 'Unknown User';
                const badge = document.getElementById('target-rating-badge');
                if (badge) badge.classList.add('hidden');
            }

            // Dynamic resolution of contextItemId if not present in URL
            if (!contextItemId) {
                try {
                    const reqSnap1 = await firebase.firestore().collection('requests')
                        .where('borrower_id', '==', currentUser.uid)
                        .get();
                    const reqSnap2 = await firebase.firestore().collection('requests')
                        .where('borrower_id', '==', targetUserId)
                        .get();
                    
                    const allReqDocs = [
                        ...reqSnap1.docs.map(doc => ({ id: doc.id, ...doc.data() })),
                        ...reqSnap2.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                    ];

                    const filteredRequests = [];
                    for (const req of allReqDocs) {
                        if (!req.item_id) continue;
                        const itemDoc = await firebase.firestore().collection('items').doc(req.item_id).get();
                        if (itemDoc.exists) {
                            const itemData = itemDoc.data();
                            const isMatch = (req.borrower_id === currentUser.uid && itemData.owner_id === targetUserId) ||
                                            (req.borrower_id === targetUserId && itemData.owner_id === currentUser.uid);
                            if (isMatch) {
                                filteredRequests.push(req);
                            }
                        }
                    }

                    filteredRequests.sort((a, b) => {
                        const tA = a.created_at?.toDate ? a.created_at.toDate().getTime() : 0;
                        const tB = b.created_at?.toDate ? b.created_at.toDate().getTime() : 0;
                        return tB - tA;
                    });

                    const activeReq = filteredRequests.find(req => req.status !== 'declined' && req.item_id) || filteredRequests.find(req => req.item_id);
                    if (activeReq) {
                        contextItemId = activeReq.item_id;
                    } else {
                        const msgSnap1 = await firebase.firestore().collection('messages')
                            .where('sender_id', '==', currentUser.uid)
                            .where('receiver_id', '==', targetUserId)
                            .get();
                        const msgSnap2 = await firebase.firestore().collection('messages')
                            .where('sender_id', '==', targetUserId)
                            .where('receiver_id', '==', currentUser.uid)
                            .get();
                        
                        const userMsgs = [
                            ...msgSnap1.docs.map(doc => doc.data()),
                            ...msgSnap2.docs.map(doc => doc.data())
                        ];

                        userMsgs.sort((a, b) => {
                            const tA = a.created_at?.toDate ? a.created_at.toDate().getTime() : 0;
                            const tB = b.created_at?.toDate ? b.created_at.toDate().getTime() : 0;
                            return tB - tA;
                        });

                        const msgWithItem = userMsgs.find(msg => msg.item_id);
                        if (msgWithItem) {
                            contextItemId = msgWithItem.item_id;
                        }
                    }
                } catch (err) {
                    console.error("Error dynamically resolving contextItemId:", err);
                }
            }

            // Context Item Logic
            if (contextItemId) {
                const itemData = await window.db.getItem(contextItemId);
                if (itemData) {
                    document.getElementById('context-card').classList.remove('hidden');
                    document.getElementById('context-item-name').textContent = itemData.name;
                    
                    const isLending = itemData.owner_id === currentUser.uid;
                    const contextCategoryEl = document.getElementById('context-item-category');
                    if (isLending) {
                        contextCategoryEl.textContent = 'Lending';
                        contextCategoryEl.className = 'text-[10px] uppercase font-black text-primary tracking-widest';
                    } else {
                        contextCategoryEl.textContent = 'Borrowing';
                        contextCategoryEl.className = 'text-[10px] uppercase font-black text-secondary tracking-widest';
                    }

                    if (itemData.image_url) {
                        document.getElementById('context-item-img').src = itemData.image_url;
                    }
                    
                    // Display listing rating from ratingsSummary
                    const itemRating = ratingsSummary.listingRatings[contextItemId];
                    const ratingEl = document.getElementById('context-item-rating');
                    const ratingTextEl = document.getElementById('context-item-rating-text');
                    
                    if (itemRating && itemRating.count > 0) {
                        ratingTextEl.textContent = `${itemRating.average.toFixed(1)} (${itemRating.count})`;
                        ratingEl.classList.remove('hidden');
                    } else {
                        ratingEl.classList.add('hidden');
                    }
                    
                    const viewItemBtn = document.querySelector('#context-card button');
                    if (viewItemBtn) {
                        viewItemBtn.onclick = () => window.location.href = `item-details.html?id=${contextItemId}`;
                    }
                }
            }

            // Clear loading placeholder
            chatMessages.innerHTML = '';
            chatMessages.innerHTML += `
            <div class="flex justify-center mt-2 mb-4">
                <span class="text-[10px] uppercase font-black text-on-surface-variant/40 tracking-[0.2em] bg-stone-100 px-4 py-1 rounded-full">Message History</span>
            </div>`;

            // Mark messages as read on entry
            await window.db.markMessagesAsRead(currentUser.uid, targetUserId);

            // Empty state placeholder (removed once messages arrive)
            chatMessages.innerHTML += `
            <div id="empty-state" class="flex flex-col items-center justify-center flex-1 py-12 text-center">
                <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-primary text-3xl">chat_bubble</span>
                </div>
                <p class="text-sm font-medium text-stone-400">No messages yet.<br>Send the first one!</p>
            </div>`;

            subscribeToMessages();
            loadTransactionStatus();
        }

        let activeRequest = null;

        function renderStepperVisual(steps, currentStepIndex, isLender, isBorrower, activeRequest, listingType) {
            const container = document.getElementById('transaction-stepper-visual');
            container.innerHTML = '';
            
            steps.forEach((step, idx) => {
                // Step item wrapper
                const stepWrapper = document.createElement('div');
                stepWrapper.className = 'flex flex-col items-center relative flex-1';
                
                // Circle button/indicator
                const circle = document.createElement('button');
                circle.disabled = true; // Disabled by default, enabled if correct user action or undo is possible
                
                let circleClass = 'w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all z-10 ';
                let statusIcon = (idx + 1).toString();
                
                if (idx < currentStepIndex) {
                    // Completed step
                    circleClass += 'bg-green-500 text-white shadow-sm';
                    statusIcon = 'check';
                    // Allow undoing if it's the immediate previous step
                    if (idx === currentStepIndex - 1) {
                        const canUndo = getUndoActionDetails(step.statusKey, isLender, isBorrower, listingType);
                        if (canUndo) {
                            circle.disabled = false;
                            circleClass += ' cursor-pointer hover:bg-red-500 hover:scale-105';
                            circle.title = `Undo: ${step.label}`;
                            circle.onclick = () => performUndo(step.statusKey);
                        }
                    }
                } else if (idx === currentStepIndex) {
                    // Active step
                    circleClass += 'bg-primary text-white ring-4 ring-primary/20 animate-pulse';
                    const canAdvance = getAdvanceActionDetails(step.statusKey, isLender, isBorrower, listingType);
                    if (canAdvance) {
                        circle.disabled = false;
                        circleClass += ' cursor-pointer hover:scale-105';
                        circle.title = `Action: ${step.label}`;
                        circle.onclick = () => updateRequestStatus(canAdvance.nextStatus);
                    }
                } else {
                    // Upcoming step
                    circleClass += 'bg-stone-200 text-stone-500';
                }
                
                circle.className = circleClass;
                
                if (statusIcon === 'check') {
                    circle.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
                } else {
                    circle.textContent = statusIcon;
                }
                
                // Label
                const label = document.createElement('span');
                label.className = `text-[9px] font-bold mt-1.5 text-center ${idx === currentStepIndex ? 'text-primary' : 'text-stone-400'}`;
                label.textContent = step.label;
                
                stepWrapper.appendChild(circle);
                stepWrapper.appendChild(label);
                
                // Line to next step
                if (idx < steps.length - 1) {
                    const line = document.createElement('div');
                    line.className = `absolute top-4 left-[50%] right-[-50%] h-[2px] -z-0 ${idx < currentStepIndex ? 'bg-green-500' : 'bg-stone-200'}`;
                    stepWrapper.appendChild(line);
                }
                
                container.appendChild(stepWrapper);
            });
        }

        function getUndoActionDetails(statusKey, isLender, isBorrower, listingType) {
            // Returns details if current user can undo this state
            if (statusKey === 'pending' && isLender) {
                // Undo from approved back to pending
                return { actionName: 'Undo Approval', nextStatus: 'pending' };
            }
            if (statusKey === 'approved' && isBorrower && listingType !== 'giveaway') {
                // Undo from borrowed back to approved
                return { actionName: 'Undo Pick Up', nextStatus: 'approved' };
            }
            if (statusKey === 'borrowed' && isBorrower && listingType !== 'giveaway') {
                // Undo from returned back to borrowed
                return { actionName: 'Undo Return', nextStatus: 'borrowed' };
            }
            if (statusKey === 'returned' && isLender && listingType !== 'giveaway') {
                // Undo from completed back to returned
                return { actionName: 'Undo Confirm Receipt', nextStatus: 'returned' };
            }
            if (statusKey === 'approved' && isLender && listingType === 'giveaway') {
                // Undo from completed back to approved for giveaway
                return { actionName: 'Undo Completed Giveaway', nextStatus: 'approved' };
            }
            return null;
        }

        function getAdvanceActionDetails(statusKey, isLender, isBorrower, listingType) {
            if (statusKey === 'pending' && isLender) {
                return { label: 'Approve', nextStatus: 'approved' };
            }
            if (statusKey === 'approved') {
                if (listingType === 'giveaway') {
                    if (isLender) {
                        return { label: 'Complete Giveaway', nextStatus: 'completed' };
                    }
                } else {
                    if (isBorrower) {
                        return { label: 'Mark Picked Up', nextStatus: 'borrowed' };
                    }
                }
            }
            if (statusKey === 'borrowed' && isBorrower && listingType !== 'giveaway') {
                return { label: 'Mark Returned', nextStatus: 'returned' };
            }
            if (statusKey === 'returned' && isLender && listingType !== 'giveaway') {
                return { label: 'Confirm Received', nextStatus: 'completed' };
            }
            return null;
        }

        async function performUndo(prevStatusKey) {
            if (!activeRequest) return;
            if (!confirm('Are you sure you want to undo this transaction step?')) return;
            
            try {
                let autoMsg = '';
                if (prevStatusKey === 'pending') {
                    await window.db.undoConfirmBorrowRequest(activeRequest.id);
                    autoMsg = '📢 *Transaction Update:* I reverted the approval (Back to Pending).';
                } else if (prevStatusKey === 'approved') {
                    // For borrowed -> approved
                    await window.db.undoMarkPickedUp(activeRequest.id, contextItemId);
                    autoMsg = '📢 *Transaction Update:* I reverted the pickup status (Back to Approved).';
                } else if (prevStatusKey === 'borrowed') {
                    await window.db.undoMarkReturned(activeRequest.id);
                    autoMsg = '📢 *Transaction Update:* I reverted the return status (Back to Borrowed).';
                } else if (prevStatusKey === 'returned' || prevStatusKey === 'approved') {
                    // Revert from completed
                    await window.db.undoConfirmReturn(activeRequest.id);
                    autoMsg = '📢 *Transaction Update:* I reverted the completion confirmation.';
                }

                if (autoMsg) {
                    await window.db.sendMessage(currentUser.uid, targetUserId, contextItemId, autoMsg);
                }
                await loadTransactionStatus();
            } catch (err) {
                alert('Error undoing step: ' + err.message);
                loadTransactionStatus();
            }
        }

        async function loadTransactionStatus() {
            if (!currentUser || !targetUserId || !contextItemId) return;
            
            try {
                const itemDoc = await firebase.firestore().collection('items').doc(contextItemId).get();
                if (!itemDoc.exists) return;
                const itemData = itemDoc.data();
                const itemOwnerId = itemData.owner_id;
                const listingType = itemData.listing_type || 'free';

                activeRequest = await window.db.getActiveRequest(contextItemId, currentUser.uid, targetUserId);

                const bar = document.getElementById('transaction-bar');
                if (!activeRequest) {
                    bar.classList.add('hidden');
                    return;
                }

                bar.classList.remove('hidden');

                const statusText = document.getElementById('transaction-status-text');
                const helperText = document.getElementById('transaction-helper-text');
                const actionsDiv = document.getElementById('transaction-actions');

                actionsDiv.innerHTML = '';
                
                const isLender = itemOwnerId === currentUser.uid;
                const isBorrower = activeRequest.borrower_id === currentUser.uid;

                // Define step sequences
                let steps = [];
                if (listingType === 'giveaway') {
                    steps = [
                        { label: 'Requested', statusKey: 'pending' },
                        { label: 'Approved', statusKey: 'approved' },
                        { label: 'Completed', statusKey: 'completed' }
                    ];
                } else {
                    steps = [
                        { label: 'Requested', statusKey: 'pending' },
                        { label: 'Approved', statusKey: 'approved' },
                        { label: 'Picked Up', statusKey: 'borrowed' },
                        { label: 'Returned', statusKey: 'returned' },
                        { label: 'Completed', statusKey: 'completed' }
                    ];
                }

                let currentStepIndex = steps.findIndex(s => s.statusKey === activeRequest.status);
                if (currentStepIndex === -1 && activeRequest.status === 'declined') {
                    // Handle declined status gracefully
                    currentStepIndex = -1;
                }

                // Render visual stepper
                if (currentStepIndex !== -1) {
                    renderStepperVisual(steps, currentStepIndex, isLender, isBorrower, activeRequest, listingType);
                } else {
                    document.getElementById('transaction-stepper-visual').innerHTML = `
                        <div class="text-xs font-bold text-red-500 flex items-center gap-1.5 py-1">
                            <span class="material-symbols-outlined">cancel</span>
                            <span>Transaction Cancelled or Declined</span>
                        </div>
                    `;
                }
                
                if (activeRequest.status === 'pending') {
                    statusText.textContent = 'Request Pending';
                    if (isLender) {
                        helperText.textContent = 'Borrower wants to borrow/claim this item.';
                        actionsDiv.innerHTML = `
                            <button onclick="updateRequestStatus('approved')" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90 active:scale-95 transition-all">Approve</button>
                            <button onclick="updateRequestStatus('declined')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Decline</button>
                        `;
                    } else {
                        helperText.textContent = 'Waiting for lender approval.';
                        actionsDiv.innerHTML = `
                            <button onclick="updateRequestStatus('declined')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Cancel Request</button>
                        `;
                    }
                } else if (activeRequest.status === 'approved') {
                    statusText.textContent = 'Request Approved';
                    if (listingType === 'giveaway') {
                        if (isLender) {
                            helperText.textContent = 'Waiting for item handover. Confirm when completed.';
                            actionsDiv.innerHTML = `
                                <button onclick="updateRequestStatus('completed')" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90 active:scale-95 transition-all">Confirm Completed</button>
                                <button onclick="performUndo('pending')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Approval</button>
                            `;
                        } else {
                            helperText.textContent = 'Approved. Please pick up the giveaway item.';
                        }
                    } else {
                        if (isBorrower) {
                            helperText.textContent = 'Agree on pickup. Click once you have the item.';
                            actionsDiv.innerHTML = `
                                <button onclick="updateRequestStatus('borrowed')" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90 active:scale-95 transition-all">Mark Picked Up</button>
                            `;
                        } else {
                            helperText.textContent = 'Approved. Waiting for borrower to pick up.';
                            actionsDiv.innerHTML = `
                                <button onclick="performUndo('pending')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Approval</button>
                            `;
                        }
                    }
                } else if (activeRequest.status === 'borrowed') {
                    statusText.textContent = 'Borrowed (In Possession)';
                    if (isBorrower) {
                        helperText.textContent = 'You have this item. Mark as returned when done.';
                        actionsDiv.innerHTML = `
                            <button onclick="updateRequestStatus('returned')" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90 active:scale-95 transition-all">Mark Returned</button>
                            <button onclick="performUndo('approved')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Pick Up</button>
                        `;
                    } else {
                        helperText.textContent = 'Borrower has picked up the item.';
                    }
                } else if (activeRequest.status === 'returned') {
                    statusText.textContent = 'Returned (Pending Receipt)';
                    if (isLender) {
                        helperText.textContent = 'Borrower marked item as returned. Confirm receipt.';
                        actionsDiv.innerHTML = `
                            <button onclick="updateRequestStatus('completed')" class="bg-primary text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90 active:scale-95 transition-all">Confirm Received</button>
                        `;
                    } else {
                        helperText.textContent = 'You returned the item. Waiting for lender confirmation.';
                        actionsDiv.innerHTML = `
                            <button onclick="performUndo('borrowed')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Return</button>
                        `;
                    }
                } else if (activeRequest.status === 'completed') {
                    statusText.textContent = 'Transaction Completed';
                    helperText.textContent = 'Carbon saved and transaction finalized!';
                    if (listingType === 'giveaway') {
                        if (isLender) {
                            actionsDiv.innerHTML = `
                                <button onclick="performUndo('approved')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Completion</button>
                            `;
                        }
                    } else {
                        if (isLender) {
                            actionsDiv.innerHTML = `
                                <button onclick="performUndo('returned')" class="bg-stone-200 text-on-surface-variant px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-stone-300 active:scale-95 transition-all">Undo Confirm Receipt</button>
                            `;
                        }
                    }
                } else if (activeRequest.status === 'declined') {
                    statusText.textContent = 'Cancelled / Declined';
                    helperText.textContent = 'This request has been cancelled or declined.';
                }
            } catch (err) {
                console.error("Error loading transaction status:", err);
            }
        }

        async function updateRequestStatus(newStatus) {
            if (!activeRequest) return;
            try {
                const btn = window.event ? window.event.target : null;
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'Updating...';
                }

                if (newStatus === 'approved') {
                    const itemData = await window.db.getItem(contextItemId);
                    const listingType = itemData ? itemData.listing_type : 'free';
                    await window.db.confirmBorrowRequest(activeRequest.id, contextItemId, listingType);
                } else if (newStatus === 'declined') {
                    await window.db.declineBorrowRequest(activeRequest.id);
                } else if (newStatus === 'borrowed') {
                    await window.db.markPickedUp(activeRequest.id, contextItemId);
                } else if (newStatus === 'returned') {
                    await window.db.markReturned(activeRequest.id);
                } else if (newStatus === 'completed') {
                    await window.db.confirmReturn(activeRequest.id);
                }

                let autoMsg = '';
                if (newStatus === 'approved') {
                    autoMsg = '📢 *Transaction Update:* I approved your request!';
                } else if (newStatus === 'declined') {
                    autoMsg = '📢 *Transaction Update:* Request has been cancelled/declined.';
                } else if (newStatus === 'borrowed') {
                    autoMsg = '📢 *Transaction Update:* I picked up the item!';
                } else if (newStatus === 'returned') {
                    autoMsg = '📢 *Transaction Update:* I returned the item!';
                } else if (newStatus === 'completed') {
                    autoMsg = '📢 *Transaction Update:* I confirmed completed! The transaction is now complete.';
                }

                if (autoMsg) {
                    await window.db.sendMessage(currentUser.uid, targetUserId, contextItemId, autoMsg);
                }

                await loadTransactionStatus();
            } catch (err) {
                alert('Error updating status: ' + err.message);
                loadTransactionStatus();
            }
        }

        // Expose to window for inline onclick handlers
        window.updateRequestStatus = updateRequestStatus;
        window.performUndo = performUndo;

        function appendMessage(msg) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.remove();

            const isMine = msg.sender_id === currentUser.uid;
            
            // Format time cleanly
            const timeVal = msg.created_at ? new Date(msg.created_at) : new Date();
            const timeString = timeVal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (isMine) {
                chatMessages.innerHTML += `
                <div class="flex flex-col items-end max-w-[85%] self-end w-full mt-4">
                    <div class="bg-primary text-white p-4 rounded-2xl rounded-tr-none leading-relaxed shadow-sm block break-words">
                        ${escapeHtml(msg.content)}
                    </div>
                    <div class="flex items-center gap-1 mt-1.5 mr-1 text-right">
                        <span class="text-[10px] text-on-surface-variant opacity-50 uppercase tracking-widest font-bold">Sent</span>
                        <span class="text-[10px] text-on-surface-variant opacity-50">•</span>
                        <span class="text-[10px] text-on-surface-variant opacity-50">${timeString}</span>
                    </div>
                </div>`;
            } else {
                chatMessages.innerHTML += `
                <div class="flex gap-3 max-w-[85%] self-start mt-4 w-full">
                    <div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 mt-1">
                        <img src="${db.sanitizeUrl(targetUser?.avatar_url) || 'https://placehold.co/100x100?text=U'}" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="bg-stone-200/50 text-on-surface p-4 rounded-2xl rounded-tl-none leading-relaxed break-words">
                            ${escapeHtml(msg.content)}
                        </div>
                        <span class="text-[10px] text-on-surface-variant mt-1.5 ml-1 block opacity-50">${timeString}</span>
                    </div>
                </div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            
            try {
                await window.db.sendMessage(
                    currentUser.uid,
                    targetUserId,
                    contextItemId || null,
                    text
                );
            } catch (error) {
                console.error("Failed to send", error);
                alert("Message failed to send.");
            }
        });

        let renderedMessageIds = new Set();
        let unsubscribeMessages = null;

        function subscribeToMessages() {
            unsubscribeMessages = window.db.subscribeToChatMessages(currentUser.uid, targetUserId, (msg) => {
                if (renderedMessageIds.has(msg.id)) return;
                renderedMessageIds.add(msg.id);
                appendMessage(msg);
                if (msg.receiver_id === currentUser.uid && !msg.is_read) {
                    window.db.markMessagesAsRead(currentUser.uid, targetUserId);
                }
                loadTransactionStatus();
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initChat);
        } else {
            initChat();
        }
    </script>
</body>
</html>

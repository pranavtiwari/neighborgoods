$kind: http-request
name: Request to Join Circle
method: POST
url: '{{firestoreBaseUrl}}/circle_join_requests'
headers:
  - key: Authorization
    value: 'Bearer {{firebaseIdToken}}'
order: 8000
body:
  type: json
  content: |-
    {
      "fields": {
        "circle_id": { "stringValue": "{{circleId}}" },
        "profile_id": { "stringValue": "{{profileId}}" },
        "status": { "stringValue": "pending" }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("fields.status.stringValue equals 'pending'", function() {
        const json = pm.response.json();
        pm.expect(json.fields.status.stringValue).to.eql("pending");
      });

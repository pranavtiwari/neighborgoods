$kind: http-request
name: List My Items
method: POST
url: '{{firestoreBaseUrl}}:runQuery'
headers:
  - key: Authorization
    value: 'Bearer {{firebaseIdToken}}'
order: 6000
body:
  type: json
  content: |-
    {
      "structuredQuery": {
        "from": [{ "collectionId": "items" }],
        "where": {
          "fieldFilter": {
            "field": { "fieldPath": "owner_id" },
            "op": "EQUAL",
            "value": { "stringValue": "{{profileId}}" }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response is an array", function() {
        const json = pm.response.json();
        pm.expect(json).to.be.an("array");
      });
      pm.test("Each result has matching owner_id", function() {
        const json = pm.response.json();
        const profileId = pm.collectionVariables.get("profileId");
        json.forEach(function(result) {
          if (result.document) {
            pm.expect(result.document.fields.owner_id.stringValue).to.eql(profileId);
          }
        });
      });

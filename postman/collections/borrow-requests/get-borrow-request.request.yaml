$kind: http-request
name: Get Borrow Request
method: GET
url: '{{firestoreBaseUrl}}/requests/{{borrowRequestId}}'
headers:
  - key: Authorization
    value: 'Bearer {{firebaseIdToken}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("fields.status exists", function() {
        const json = pm.response.json();
        pm.expect(json.fields).to.have.property("status");
      });
      pm.test("fields.item_id exists", function() {
        const json = pm.response.json();
        pm.expect(json.fields).to.have.property("item_id");
      });

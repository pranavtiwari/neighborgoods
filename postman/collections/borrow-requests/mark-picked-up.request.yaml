$kind: http-request
name: Mark Picked Up
method: PATCH
url: '{{firestoreBaseUrl}}/requests/{{borrowRequestId}}?updateMask.fieldPaths=status'
headers:
  - key: Authorization
    value: 'Bearer {{firebaseIdToken}}'
order: 6000
body:
  type: json
  content: |-
    {
      "fields": {
        "status": { "stringValue": "borrowed" }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("fields.status.stringValue equals 'borrowed'", function() {
        const json = pm.response.json();
        pm.expect(json.fields.status.stringValue).to.eql("borrowed");
      });
